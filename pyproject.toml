[project]
name = "demo_2"
version = "0.1.0"
description = "Personal Expense Tracker Streamlit App"
readme = "README.md"
requires-python = ">3.12"
dependencies = [
    "streamlit>=1.26.0",
    "matplotlib>=3.10.3",
    "pandas>=2.3.0"
]

[tool.uv]
python-downloads = "never"
python-preference = "only-system"
cache-dir = ".uv-cache"
package = false
